[package]
name = "morfa-geometry-wasm"
description = "Lane L1's geometry as a wasm module of its own (booleans, outline stroke), loaded only when the engine switch runs geometry as wasm or both (scripts/wasm-geometry-build.sh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Every entry point of lane L1's differential harness (scripts/geometry/build.sh → scripts/geometry/pkg): the
# per-function paths/shapes/matrix entries, documents parsed from JSON, hit testing and the spatial grid. The
# editor's module leaves them out: it parses no documents, so morfa-model's JSON reader is not linked.
harness = ["dep:serde_json"]

[dependencies]
morfa-geometry.workspace = true
morfa-model.workspace = true
wasm-bindgen.workspace = true
serde_json = {version = "1", features = ["preserve_order", "float_roundtrip"], optional = true}

[package.metadata.wasm-pack.profile.release]
# The workspace's release profile optimises for size (opt-level "s", lane L1's request 2); wasm-opt adds its own pass.
wasm-opt = ["-Os"]

[lints]
workspace = true
