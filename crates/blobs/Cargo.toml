[package]
name = "morfa-blobs"
description = "Object storage for the collab backend: the S3 client (path-style, SigV4), an in-memory fake, and content-addressed pictures (lane B2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
hmac = "0.12"
md-5 = "0.10"
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls"]}
sha2 = "0.10"
tokio = {version = "1", features = ["rt", "sync", "time", "macros"]}

[dev-dependencies]
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}

[lints]
workspace = true
