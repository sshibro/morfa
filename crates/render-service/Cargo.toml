[package]
name = "morfa-render-service"
description = "The render/export service (lane B4, docs/BACKEND.md §4): SVG and the vector PDF from crates/export, raster (PNG/JPG/WebP, thumbnails) from crates/render on vello_cpu, behind POST /internal/render. No browser, no outbound network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "morfa-render"
path = "src/main.rs"

[dependencies]
morfa-model.workspace = true
morfa-geometry.workspace = true
morfa-text = {workspace = true, default-features = false}
# The vector PDF (fonts, resvg for shadows and blurs) and the SVG of lane L5.
morfa-export = {workspace = true, features = ["pdf"]}
# Lane L4's CPU renderer (vello_cpu) behind raster jobs, and the picture codecs of the editor's uploads: PNG (shared
# with L5's PDF images), JPEG and WebP decoding (the crates resvg already brings), JPEG and lossless WebP encoding.
morfa-render.workspace = true
zune-jpeg = {version = "0.4", default-features = false, features = ["std"]}
image-webp = "0.2"
jpeg-encoder = "0.6"
axum = {version = "0.8", default-features = false, features = ["http1", "json", "tokio"]}
png = "0.17"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
tokio = {version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"]}
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter", "fmt"]}

[dev-dependencies]
tower = {version = "0.5", default-features = false, features = ["util"]}
http-body-util = "0.1"

[lints]
workspace = true
