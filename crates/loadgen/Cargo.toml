[package]
name = "morfa-loadgen"
description = "Synthetic editors for the multiplayer benches (lane B0, docs/TARGETS.md §3): the legacy SSE + PATCH path and the collab WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "loadgen"
path = "src/main.rs"

[dependencies]
bytes = "1"
futures-util = {version = "0.3", default-features = false, features = ["sink", "std"]}
http-body-util = "0.1"
hyper = {version = "1", features = ["client", "http1"]}
hyper-util = {version = "0.1", features = ["tokio"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
tokio = {version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"]}
tokio-tungstenite = "0.29"

[lints]
workspace = true
