[package]
name = "morfa-export-wasm"
description = "Lane L5's export (SVG, vector PDF) as a wasm module of its own, loaded only when something is exported (scripts/wasm-export-build.sh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
morfa-export = {path = "../export", default-features = false}
morfa-geometry.workspace = true
morfa-model.workspace = true
morfa-text = {workspace = true, default-features = false}
wasm-bindgen.workspace = true
js-sys = "0.3"
serde_json = {version = "1", features = ["preserve_order", "float_roundtrip"]}

[features]
default = []
# Outline text and the PDF's embedded fonts (the font store, harfrust, skrifa).
fonts = ["morfa-export/fonts"]
# The WHATWG URL parser for print-flavour links (the server's build; `pdf` has it).
whatwg-url = ["morfa-export/whatwg-url"]
# The vector PDF (needs fonts).
pdf = ["fonts", "morfa-export/pdf"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]

[lints]
workspace = true
