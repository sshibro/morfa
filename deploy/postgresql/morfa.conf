# Morfa's PostgreSQL 18 settings (conf.d/morfa.conf of the cluster; lane B5). Sized for a 16 GB VM that also runs the services
# (TARGETS §0 bench-ru / ru-4). B2's rule: an ack means journaled, so fsync and synchronous_commit stay on.
listen_addresses = '127.0.0.1'
max_connections = 200
shared_buffers = 3GB
effective_cache_size = 10GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# Durability (TARGETS D1: group commit p99 ≤ 10 ms on NVMe).
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
wal_compression = lz4
wal_buffers = 64MB
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# Journal rows are TOASTed op bodies.
default_toast_compression = lz4

# NVMe.
random_page_cost = 1.1
effective_io_concurrency = 200

# Continuous WAL archive to S3 with pgBackRest (deploy/pgbackrest/pgbackrest.conf.example); nightly base backup by
# morfa-backup.timer. A streaming replica (scripts/deploy/pg-replica.md) needs these too.
archive_mode = on
archive_command = 'pgbackrest --stanza=morfa archive-push %p'
archive_timeout = 60s
max_wal_senders = 10
wal_keep_size = 2GB

# Observability (postgres_exporter, pg_stat_statements).
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
