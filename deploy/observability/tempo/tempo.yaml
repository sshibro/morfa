# Tempo: OTLP/HTTP from api and collab on 127.0.0.1:4318 (JSON or protobuf), queries on 127.0.0.1:3200. Local storage,
# 7 days of traces (spans are sampled: 1 % of ops plus every slow one).
stream_over_http_enabled: true
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318
        grpc:
          endpoint: 127.0.0.1:4317
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
