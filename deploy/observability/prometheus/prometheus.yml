# Scrapes every Morfa service on this host (bench-ru layout; production adds the other VMs' private addresses).
# Ports: deploy/systemd (api 940N metrics, collab 342N), Caddy admin 2019, MinIO 9000 (bench), exporters 9100/9187.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Alerts (alerts.yml) go to Alertmanager (docker-compose.yml), which delivers them where the operator chose
# (deploy/observability/alertmanager).
alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:9093]

rule_files:
  - /etc/prometheus/alerts.yml
  # morfa_target_live{row,metric}: every TARGETS row production can measure, in the row's unit (scripts/deploy/dashboards.ts).
  - /etc/prometheus/targets-rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: [127.0.0.1:9401, 127.0.0.1:9402]
  - job_name: collab
    static_configs:
      - targets: [127.0.0.1:3421]
        labels: {node: a}
      - targets: [127.0.0.1:3422]
        labels: {node: b}
  - job_name: render
    static_configs:
      - targets: [127.0.0.1:3440]
  - job_name: caddy
    static_configs:
      - targets: [127.0.0.1:2019]
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]
  - job_name: postgres
    static_configs:
      - targets: [127.0.0.1:9187]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [127.0.0.1:9000]
  - job_name: observability
    static_configs:
      - targets: [127.0.0.1:9090, 127.0.0.1:3200, 127.0.0.1:3100, 127.0.0.1:12345, 127.0.0.1:9093]
