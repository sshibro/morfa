# Morfa's desktop shell (Tauri 2, lane D1, docs/desktop.md). Its own workspace: the root workspace excludes desktop/,
# so the gate's `cargo test --workspace` and clippy never build Tauri or need webkit2gtk.
[workspace]

[package]
name = "morfa-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
description = "Morfa desktop: the hosted editor in a native window, plus local fonts, menus, files and updates"

[lib]
name = "morfa_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = {version = "=2.7.1", features = [] }

[dependencies]
tauri = {version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-updater = "=2.13.2"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = {version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-opener = "=2.7.0"
fontdb = "0.23"
serde = {version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = {version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
# The accelerator parser Tauri's menus use (already in the tree through tauri): menu.rs tests its strings with it.
muda = {version = "=0.20.0", default-features = false}
tauri = {version = "=2.12.1", features = ["test"] }

[features]
# Test hooks for the xvfb smoke run only (scripts/smoke): dialogs answer from MORFA_DESKTOP_SMOKE_* paths.
smoke = []

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
